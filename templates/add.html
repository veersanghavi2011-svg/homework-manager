<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>Add Homework</title>
</head>


<body>

<header>
    <h2>➕ Add Homework</h2>
</header>


<div class="container">

    <div class="card">

        <h1>Add New Assignment</h1>

        <p>
            Enter your homework details below.
        </p>


        <form method="POST">

            <label>
                Homework Name
            </label>

            <input 
                type="text"
                name="name"
                placeholder="Example: Math Worksheet"
                required
            >


            <label>
                Description
            </label>

            <textarea
                name="description"
                placeholder="Add details about the assignment"
                rows="4"
                required
            ></textarea>


            <label>
                Due Date
            </label>

            <input
                type="date"
                name="due_date"
                required
            >


            <label>
                Priority
            </label>

            <select name="priority" id="priority" required>

                <option value="High">
                    High
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Low">
                    Low
                </option>

            </select>


            <button 
                type="button" 
                class="secondary"
                onclick="suggestPriority()"
            >
                🤖 Suggest Priority
            </button>


            <button 
                type="button" 
                class="secondary"
                onclick="createStudyPlan()"
            >
                📅 Create Study Plan
            </button>
            <div id="ai-results" class="card" style="display:none;">

    <h2>🤖 AI Assistant</h2>

    <div id="priority-result"></div>

    <div id="study-result"></div>

    </div>


            <br><br>


            <div class="buttons">

                <button type="submit" class="primary">
                    Add Homework
                </button>


                <a href="{{ url_for('home') }}" class="secondary">
                    Cancel
                </a>

            </div>


        </form>

    </div>

</div>


<script>

function suggestPriority(){

    let description = document.querySelector(
        'textarea[name="description"]'
    ).value;

    let dueDate = document.querySelector(
        'input[name="due_date"]'
    ).value;


    fetch("/suggest_priority", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },

        body:
        "description=" + encodeURIComponent(description) +
        "&due_date=" + encodeURIComponent(dueDate)

    })

    .then(response => response.json())

    .then(result => {

        document.getElementById("priority").value = result.priority;


        document.getElementById("ai-results").style.display = "block";


        document.getElementById("priority-result").innerHTML = `

            <h3>⭐ Suggested Priority: ${result.priority}</h3>

            <p>
                💡 Reason: ${result.reason}
            </p>

        `;

    });

}



function createStudyPlan(){

    let description = document.querySelector(
        'textarea[name="description"]'
    ).value;


    let dueDate = document.querySelector(
        'input[name="due_date"]'
    ).value;


    fetch("/study_plan", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },

        body:
        "description=" + encodeURIComponent(description) +
        "&due_date=" + encodeURIComponent(dueDate)

    })

    .then(response => response.json())

    .then(result => {


        document.getElementById("ai-results").style.display = "block";


        let plan = "<h3>📅 Study Plan</h3><ul>";


        result.plan.forEach(item => {

            plan += "<li>" + item + "</li>";

        });


        plan += "</ul>";


        document.getElementById("study-result").innerHTML = plan;


    });

}

</script>


</body>

</html>
